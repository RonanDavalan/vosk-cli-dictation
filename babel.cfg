# babel.cfg
#
# This configuration file tells Babel which files to scan for translatable strings.
# We are telling it to look for the gettext function call `_()` in all Python
# files located inside the 'src' directory, and in the notification-area icon
# program (tray/vosk_cli_dictation_tray; its tray/venv is not scanned), whose
# translator object is called `t`, `_t` or `translator` (see manage_translations.sh).

[python: src/**.py]
[python: tray/vosk_cli_dictation_tray/**.py]
