vosk_models:
  - name: "en"
    path_relative: "vosk-model/vosk-model-small-en-us-0.15"
  - name: "fr"
    path_relative: "vosk-model/vosk-model-small-fr-0.22"
  - name: "de"
    path_relative: "vosk-model/vosk-model-small-de-0.15"
  - name: "es"
    path_relative: "vosk-model/vosk-model-small-es-0.42"

default_model: "fr"

# Socket de contrôle Unix dans $XDG_RUNTIME_DIR (chantier 7 volet A) : permet de
# piloter une session en cours via les sous-commandes CLI (--toggle, --sleep,
# --status…) liées aux raccourcis globaux de n'importe quel bureau.
control_socket: true

audio:
  sample_rate: 16000
  channels: 1
  frames_per_buffer: 4096
  buffer_size: 2048
  # Taille max de la file audio, en blocs de buffer_size échantillons.
  # 16 blocs ≈ 2 s. Au-delà, le bloc le plus ancien est jeté (chantier 7 volet C).
  queue_max_chunks: 16

recognition:
  # Un déclenchement vocal (réveil ou arrêt) n'est retenu que si la confiance
  # moyenne des mots de la phrase-clé atteint ce seuil (chantier 7 volet E).
  # Garde indépendant de la grammaire restreinte, actif aussi en DICTÉE.
  # Chantier 7 bis : abaissé 0.85 -> 0.55. 0.85 bloquait « stop dictée » même
  # avec du contexte (mesuré : conf 0.70 sur une phrase Piper fr, Pi 4). Ce seuil
  # ne gouverne QUE le chemin plein vocabulaire : il protège le document (une
  # phrase-clé sous le seuil est absorbée, pas tapée) et sert de repli. Le
  # chemin fiable pour l'arrêt est restricted_stop_in_dictation ci-dessous.
  # Surchargeable par langue via language_settings.<lang>.confidence_threshold.
  confidence_threshold: 0.55
  # En ÉCOUTE, décoder avec une grammaire Kaldi restreinte à la seule phrase de
  # réveil : le CPU au repos chute, au prix d'une reconstruction du recognizer
  # complet au réveil (chantier 7 volet E). false = recognizer complet en ÉCOUTE.
  restricted_grammar_in_listening: true
  # Chantier 7 bis : en DICTÉE, un second recognizer léger à grammaire restreinte
  # à [stop_phrase, "[unk]"]. EXPÉRIMENTAL, false par défaut : en usage réel
  # (voix humaine, micro réel), la grammaire restreinte « force » une
  # interprétation et déclenche des arrêts intempestifs en pleine phrase
  # (constaté 28/08 : coupé sur « si je veux dire »). Les clips Piper — voix
  # propre unique — ne reproduisent pas ce faux positif, donc ils ne suffisent
  # pas à valider ce mécanisme. Tant qu'un protocole de validation anti-faux-
  # positif n'est pas en place, l'arrêt vocal repose sur le chemin plein
  # vocabulaire (confidence_threshold ci-dessus) + absorption sous le seuil (D1).
  # Surchargeable par langue via language_settings.<lang>.restricted_stop_in_dictation.
  restricted_stop_in_dictation: false
  # Chantier 7 ter : après un réveil (« active dictée »), durée pendant laquelle
  # l'audio mis en file avant la bascule en DICTÉE est jeté sans être décodé —
  # il ne contient que la fin de la phrase de réveil et du silence, et
  # produisait un mot parasite (« Les »). Surchargeable par langue.
  wake_discard_ms: 300

sleep:
  # true : en VEILLE, le flux audio est fermé — micro relâché, LED éteinte,
  #        réouverture ~200 ms au réveil (chantier 7 volet D).
  # false : le flux est seulement arrêté, périphérique conservé, réveil plus rapide.
  releases_device: true

clipboard:
  # Restaurer le presse-papiers de l'utilisateur après le collage (chantier 7 volet B).
  restore: true
  # Délai avant restauration, laissé à l'application cible pour lire le presse-papiers.
  restore_delay_ms: 250
  # Durée max d'attente de la confirmation que le presse-papiers contient bien
  # notre texte, avant d'envoyer Ctrl+V.
  confirm_timeout_ms: 500

injection:
  # Combo de collage par défaut, et variante utilisée quand la fenêtre active
  # est un terminal (détection de classe sous X11 seulement).
  paste_combo: "ctrl+v"
  terminal_paste_combo: "ctrl+shift+v"
  terminal_window_classes:
    - "konsole"
    - "gnome-terminal-server"
    - "xterm"
    - "st"
    - "alacritty"
    - "kitty"
    - "foot"
  # Repli ydotool uniquement : keycodes physiques Linux. À surcharger sous une
  # disposition non-QWERTY si le repli ydotool est réellement utilisé.
  ydotool_keycodes: {}

# Chantier 7 volet E/F : phrases de déclenchement à deux mots (wake_phrase /
# stop_phrase), typographie pilotée par données (bloc typography), table d'alias
# d'usine réduite aux corrections génériques et indiscutables. Les corrections
# liées à un corpus de prose précis vivent dans config.example.yaml, à recopier
# et adapter par l'utilisateur.
language_settings:
  en:
    # Grammaire Kaldi restreinte en ÉCOUTE (chantier 7 volet E). Surcharge la
    # clé globale recognition.restricted_grammar_in_listening pour cette langue.
    restricted_grammar_in_listening: true
    voice_commands:
      wake_phrase: "start dictation"
      stop_phrase: "stop dictation"
    punctuation:
      mode: inline            # inline | explicit
      trigger: punctuation    # used when mode == explicit
      simple:
        "comma": ","
        "period": "."
      double:
        "question mark": "?"
        "exclamation mark": "!"
        "colon": ":"
        "semicolon": ";"
      layout:
        "new line": "\n"
        "new paragraph": "\n\n"
      special:
        "open parenthesis": "("
        "close parenthesis": ")"
        "open bracket": "["
        "close bracket": "]"
        "dash": "–"
        "ellipsis": "…"
        "open quote": "\""
        "close quote": "\""
    typography:
      thin_space: false
      space_before: []
      space_after: [",", ".", ";", ":", "?", "!"]
      capitalize_sentence_start: true
      quote_open: "\""
      quote_close: "\""
    recognition_aliases: {}
    custom_vocabulary:
      "vosk": "Vosk"
      "py audio": "PyAudio"

  fr:
    restricted_grammar_in_listening: true
    voice_commands:
      wake_phrase: "active dictée"
      stop_phrase: "stop dictée"
    punctuation:
      mode: inline            # inline | explicit
      trigger: ponctuation    # used when mode == explicit
      simple:
        "virgule": ","
        "point": "."
      double:
        "point d'interrogation": "?"
        "point d'exclamation": "!"
        "deux points": ":"
        "point virgule": ";"
        "point-virgule": ";"
      layout:
        "nouvelle ligne": "\n"
        "à la ligne": "\n"
        "nouveau paragraphe": "\n\n"
      special:
        "ouvrez la parenthèse": "("
        "fermez la parenthèse": ")"
        "ouvrez le crochet": "["
        "fermez le crochet": "]"
        "tiret": "–"
        "trois petits points": "…"
        "ouvrez les guillemets": "« "
        "fermez les guillemets": "»"
    typography:
      thin_space: true
      space_before: ["?", "!", ":", ";", "»"]
      space_after: [",", ".", ";", ":", "?", "!"]
      capitalize_sentence_start: true
      quote_open: "« "
      quote_close: "»"
    recognition_aliases:
      "fermer la parenthèse": "fermez la parenthèse"
      "fermer le crochet": "fermez le crochet"
      "fermer les guillemets": "fermez les guillemets"
      "de points": "deux points"
      # R2 (28/08 soir, arbitrage option 1) : homophones de « tiret »
      # réellement transcrits par le modèle fr (matrice Piper : « tirer »,
      # « tirés », « tirait »). Livrés par défaut. « trait » est volontairement
      # PAS une commande de ponctuation (« un trait de génie » doit rester
      # inchangé) ; « tirée » reste dans config.example.yaml (forme non
      # observée par la matrice).
      "tirer": "tiret"
      "tirés": "tiret"
      "tirait": "tiret"
      "tirez": "tiret"
    custom_vocabulary:
      "vosk": "Vosk"
      "gemini": "Gemini"
      "ia": "IA"

  de:
    restricted_grammar_in_listening: true
    voice_commands:
      wake_phrase: "diktat starten"
      stop_phrase: "diktat stoppen"
    punctuation:
      mode: inline            # inline | explicit
      trigger: satzzeichen    # used when mode == explicit
      simple:
        "komma": ","
        "punkt": "."
      double:
        "fragezeichen": "?"
        "ausrufezeichen": "!"
        "doppelpunkt": ":"
        "semikolon": ";"
      layout:
        "neue zeile": "\n"
        "neuer absatz": "\n\n"
      special:
        "klammer auf": "("
        "klammer zu": ")"
        "eckige klammer auf": "["
        "eckige klammer zu": "]"
        "gedankenstrich": "–"
        "auslassungspunkte": "…"
        "anführungszeichen auf": "„"
        "anführungszeichen zu": "“"
    typography:
      # Allemand : pas d'espace avant ? ! : ; ; guillemets „ … “ ;
      # capitalisation en début de phrase seulement (chantier 7 volet F,
      # décision n°5 : pas d'analyseur morphologique pour les noms communs).
      thin_space: false
      space_before: []
      space_after: [",", ".", ";", ":", "?", "!"]
      capitalize_sentence_start: true
      quote_open: "„"
      quote_close: "“"
    recognition_aliases: {}
    custom_vocabulary:
      "vosk": "Vosk"

  es:
    # false : sur trois machines de test (station x86, Raspberry Pi 4, x86
    # modeste), la grammaire restreinte avec vosk-model-small-es-0.42 décode
    # ~2× plus lentement que la grammaire complète (RTF ×0,5). On garde le
    # recognizer complet en ÉCOUTE pour cette langue ; le réveil se fait alors
    # sur les finaux avec le garde de confiance.
    restricted_grammar_in_listening: false
    voice_commands:
      wake_phrase: "iniciar dictado"
      stop_phrase: "terminar dictado"
    punctuation:
      mode: inline            # inline | explicit
      trigger: puntuación     # used when mode == explicit
      simple:
        "coma": ","
        "punto": "."
      double:
        "interrogación": "?"
        "exclamación": "!"
        "dos puntos": ":"
        "punto y coma": ";"
      layout:
        "nueva línea": "\n"
        "nuevo párrafo": "\n\n"
      special:
        # Ouvrants espagnols par commande explicite (chantier 7 volet F) :
        # pas d'insertion automatique de ¿ / ¡, qui exigerait l'analyse de
        # portée de la proposition.
        "abrir interrogación": "¿"
        "abrir exclamación": "¡"
        "abrir paréntesis": "("
        "cerrar paréntesis": ")"
        "abrir corchete": "["
        "cerrar corchete": "]"
        "raya": "–"
        "puntos suspensivos": "…"
        "abrir comillas": "\""
        "cerrar comillas": "\""
    typography:
      thin_space: false
      space_before: []
      space_after: [",", ".", ";", ":", "?", "!"]
      capitalize_sentence_start: true
      quote_open: "\""
      quote_close: "\""
    recognition_aliases: {}
    custom_vocabulary:
      "vosk": "Vosk"

hotkeys:
  # pynput n'écoute que sous X11 (aveugle sous Wayland natif). Sous Wayland,
  # utiliser les sous-commandes CLI liées aux raccourcis du bureau.
  pynput_enabled: true
  toggle_recording:
    pynput_keys: ["alt_l", "h"]
    display_name: "[Alt+H]"
  finalize_session:
    pynput_keys: ["alt_l", "s"]
    display_name: "[Alt+S]"
  sleep_toggle:
    pynput_keys: ["alt_l", "w"]
    display_name: "[Alt+W]"

sound_file: "/usr/share/sounds/freedesktop/stereo/audio-volume-change.oga"

# La couleur ne marque que les accents : titres de section et bandeau « prêt ».
# Le corps du texte (`help_text`, `info`) prend la couleur par défaut du
# terminal via `RESET`, ce qui reste lisible sur un thème clair comme sombre.
# `BLUE` (ANSI 4) est proscrit pour du texte courant : illisible ou viré au
# violet selon le thème.
theme:
  ready_message: "GREEN"
  help_text: "RESET"
  help_title: "CYAN"
  info: "RESET"
  success: "GREEN"
  warning: "YELLOW"
  error: "RED"
